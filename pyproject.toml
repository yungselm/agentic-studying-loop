[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-studying-loop"
version = "0.1.0"
description = "Turn what you learn while coding into study notes and Anki cards, with an AI agent and standards tuned by your own review data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["genanki>=0.13", "PyYAML>=6.0", "pypdf>=4", "Pillow>=10", "zstandard>=0.21"]

[project.optional-dependencies]
dev = ["build", "pytest>=7", "ruff>=0.4", "import-linter>=2"]
python = ["pytest>=7", "ruff>=0.4"]   # asl check for Python cards (the python pack's checker)
lang = ["wordfreq>=3.1", "imageio-ffmpeg>=0.5", "edge-tts>=6.1"]   # language decks (asl lang)
lang-ja = ["agentic-studying-loop[lang]", "fugashi>=1.3", "unidic-lite>=1.0.8"]   # + Japanese
lang-de = ["agentic-studying-loop[lang]", "spacy>=3.7,<4",                        # + German
           "de_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl"]
analysis = ["pandas>=2.0", "matplotlib>=3.7"]   # asl stats: review data, reports, figures
bench = ["matplotlib>=3.8"]                       # benchmarks/report.py: charts
docs = ["sphinx>=7", "myst-parser>=3", "furo"]   # the docs site: sphinx-build -W docs docs/_build

[project.scripts]
asl = "studyloop.core.cli:main"

# Modules (docs/architecture.md). After adding or renaming one: `uv sync`, so `asl` finds it.
[project.entry-points."studyloop.modules"]
analysis = "studyloop.analysis:MODULE"
language = "studyloop.language:MODULE"
language_de = "studyloop.language_de:MODULE"
language_ja = "studyloop.language_ja:MODULE"
notes = "studyloop.notes:MODULE"
projects = "studyloop.projects:MODULE"
sources = "studyloop.sources:MODULE"

[tool.setuptools]
packages = [
    "studyloop",
    "studyloop.analysis",
    "studyloop.analysis.analyses",
    "studyloop.core",
    "studyloop.core.anki",
    "studyloop.core.cards",
    "studyloop.core.config",
    "studyloop.core.engine",
    "studyloop.language",
    "studyloop.language.cards",
    "studyloop.language.grammar",
    "studyloop.language.media",
    "studyloop.language.vocabulary",
    "studyloop.language_de",
    "studyloop.language_ja",
    "studyloop.notes",
    "studyloop.projects",
    "studyloop.sources",
    "studyloop_skills",
]

[tool.setuptools.package-dir]
studyloop = "studyloop"
studyloop_skills = "skills"          # the plugin's skills/ folder, shipped with the tool

[tool.setuptools.package-data]
"studyloop.projects" = ["modes/*", "templates/*"]
"studyloop.sources" = ["templates/*"]
"studyloop.language" = ["templates/*"]
"studyloop.language.cards" = ["anki/*"]
"studyloop.language_de" = ["*.yaml"]
"studyloop.language_ja" = ["*.yaml"]
"studyloop.core" = ["packs/*/*", "standards/*", "templates/*/*"]
"studyloop.core.anki" = ["templates/*", "vendor/*"]
studyloop_skills = ["*/SKILL.md"]

[tool.ruff]
line-length = 100
extend-exclude = ["studyloop/core/packs/*/mode.js", "examples", "example-vault"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM"]
ignore = ["SIM108", "SIM905", "E501", "B905", "B007"]


# Dependency rules (docs/architecture.md): run `lint-imports`.
[tool.importlinter]
root_package = "studyloop"

[[tool.importlinter.contracts]]
name = "core never imports a module"
type = "forbidden"
source_modules = ["studyloop.core"]
forbidden_modules = ["studyloop.analysis", "studyloop.language", "studyloop.language_de", "studyloop.language_ja", "studyloop.notes", "studyloop.projects", "studyloop.sources"]

[[tool.importlinter.contracts]]
name = "analysis imports only core"
type = "forbidden"
source_modules = ["studyloop.analysis"]
forbidden_modules = ["studyloop.language", "studyloop.language_de", "studyloop.language_ja", "studyloop.notes", "studyloop.projects", "studyloop.sources"]

[[tool.importlinter.contracts]]
name = "language imports only core, sources"
type = "forbidden"
source_modules = ["studyloop.language"]
forbidden_modules = ["studyloop.analysis", "studyloop.language_de", "studyloop.language_ja", "studyloop.notes", "studyloop.projects"]

[[tool.importlinter.contracts]]
name = "language_ja imports only core, language"
type = "forbidden"
source_modules = ["studyloop.language_ja"]
forbidden_modules = ["studyloop.analysis", "studyloop.language_de", "studyloop.notes", "studyloop.projects", "studyloop.sources"]

[[tool.importlinter.contracts]]
name = "language_de imports only core, language"
type = "forbidden"
source_modules = ["studyloop.language_de"]
forbidden_modules = ["studyloop.analysis", "studyloop.language_ja", "studyloop.notes", "studyloop.projects", "studyloop.sources"]

[[tool.importlinter.contracts]]
name = "notes imports only core"
type = "forbidden"
source_modules = ["studyloop.notes"]
forbidden_modules = ["studyloop.analysis", "studyloop.language", "studyloop.language_de", "studyloop.language_ja", "studyloop.projects", "studyloop.sources"]

[[tool.importlinter.contracts]]
name = "projects imports only core"
type = "forbidden"
source_modules = ["studyloop.projects"]
forbidden_modules = ["studyloop.analysis", "studyloop.language", "studyloop.language_de", "studyloop.language_ja", "studyloop.notes", "studyloop.sources"]

[[tool.importlinter.contracts]]
name = "sources imports only core"
type = "forbidden"
source_modules = ["studyloop.sources"]
forbidden_modules = ["studyloop.analysis", "studyloop.language", "studyloop.language_de", "studyloop.language_ja", "studyloop.notes", "studyloop.projects"]
