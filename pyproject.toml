[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-studying-loop"
version = "0.1.0"
description = "Turn what you learn while coding into study notes and Anki cards, with an AI agent and standards tuned by your own review data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["genanki>=0.13", "PyYAML>=6.0", "pypdf>=4", "zstandard>=0.21", "pytest>=7", "ruff>=0.4"]

[project.optional-dependencies]
dev = ["build"]
lang = ["fugashi>=1.3", "unidic-lite>=1.0.8", "wordfreq>=3.1"]   # language topics (asl lang)

[project.scripts]
asl = "studyloop.cli:main"

[tool.setuptools]
packages = ["studyloop", "studyloop.lang", "studyloop_skills"]

[tool.setuptools.package-dir]
studyloop = "studyloop"
studyloop_skills = "skills"          # the plugin's skills/ folder, shipped with the tool

[tool.setuptools.package-data]
studyloop = ["anki/*/*", "packs/*/*", "standards/*", "modes/*", "templates/*/*", "lang/*.yaml"]
studyloop_skills = ["*/SKILL.md"]

[tool.ruff]
line-length = 100
extend-exclude = ["studyloop/packs/*/mode.js", "examples", "example-vault"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM"]
ignore = ["SIM108", "SIM905", "E501", "B905", "B007"]
