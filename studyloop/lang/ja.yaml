# Japanese: how `asl lang` reads, levels and orders it.
name: Japanese
tokenizer: unidic            # fugashi + unidic-lite (pip extra: agentic-studying-loop[lang])
frequency: wordfreq          # general word frequency (wordfreq's Japanese list)
length_cap: 30               # characters; longer lines fail more (Game Gengo: >30 chars 17% vs 9%)
speaker_labels: '（[^）]*）'   # Japanese TV subtitles: （名前）; also drops （笑い） etc.
strip: '\(([ぁ-ゖァ-ヺー]+)\)'  # inline readings after names: 軽井沢(かるいざわ)
levels:
  order: [N5, N4, N3, N2, N1]
  credit: "JLPT word lists from github.com/jamsinclair/open-anki-jlpt-decks (MIT)"
  format: csv                # columns: expression, reading
  lists:
    N5: https://raw.githubusercontent.com/jamsinclair/open-anki-jlpt-decks/main/src/n5.csv
    N4: https://raw.githubusercontent.com/jamsinclair/open-anki-jlpt-decks/main/src/n4.csv
    N3: https://raw.githubusercontent.com/jamsinclair/open-anki-jlpt-decks/main/src/n3.csv
    N2: https://raw.githubusercontent.com/jamsinclair/open-anki-jlpt-decks/main/src/n2.csv
    N1: https://raw.githubusercontent.com/jamsinclair/open-anki-jlpt-decks/main/src/n1.csv
