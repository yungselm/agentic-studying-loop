# Japanese: how `asl lang` reads, levels and orders it.
name: Japanese
tokenizer: unidic            # fugashi + unidic-lite (pip extra: agentic-studying-loop[lang-ja])
frequency: wordfreq          # general word frequency (wordfreq's Japanese list)
clip_padding: [0.25, 0.4]     # s before/after a line when cutting from video
screenshot_width: 960        # px, at most (screenshots from video)
length_cap: 30               # characters; longer lines fail more (Game Gengo: >30 chars 17% vs 9%)
subtitle_keep: '[ぁ-んァ-ヶ]'      # cues without kana are not Japanese (credits, Chinese lines)
speaker_labels: '（[^）]*）'   # Japanese TV subtitles: （名前）; also drops （笑い） etc.
strip: '\(([ぁ-ゖァ-ヺー]+)\)'  # inline readings after names: 軽井沢(かるいざわ)
levels:
  order: [N5, N4, N3, N2, N1]
  credit: "JLPT word lists from github.com/jamsinclair/open-anki-jlpt-decks (MIT)"
  format: csv                # columns: expression, reading
  lists:
    N5: https://raw.githubusercontent.com/jamsinclair/open-anki-jlpt-decks/main/src/n5.csv
    N4: https://raw.githubusercontent.com/jamsinclair/open-anki-jlpt-decks/main/src/n4.csv
    N3: https://raw.githubusercontent.com/jamsinclair/open-anki-jlpt-decks/main/src/n3.csv
    N2: https://raw.githubusercontent.com/jamsinclair/open-anki-jlpt-decks/main/src/n2.csv
    N1: https://raw.githubusercontent.com/jamsinclair/open-anki-jlpt-decks/main/src/n1.csv
dictionary:
  url: http://ftp.edrdg.org/pub/Nihongo/JMdict.gz
  credit: "JMdict, Electronic Dictionary Research and Development Group, CC BY-SA 4.0"
reading_aid: furigana          # cards keep readings as 漢字[かんじ] (Anki's furigana filter)
reading_fixes:                 # unidic-lite readings that are wrong in everyday speech
  私: わたし
  今日: きょう
grammar_lists:                 # the JLPT grammar ground truth (checklist in the grammar overview)
  name: JLPT                    # "JLPT points covered" in the overview
  source: the JLPT lists (JLPT Sensei)
  credit: "JLPT grammar lists from jlptsensei.com"
  pages:
    N5: https://jlptsensei.com/jlpt-n5-grammar-list/
    N4: https://jlptsensei.com/jlpt-n4-grammar-list/
    N3: https://jlptsensei.com/jlpt-n3-grammar-list/
    N2: https://jlptsensei.com/jlpt-n2-grammar-list/
    N1: https://jlptsensei.com/jlpt-n1-grammar-list/
tts:                           # fallback audio (`asl lang tts`), engines tried in order
  engines: [voicevox, edge]
  voicevox_url: http://127.0.0.1:50021   # a running VOICEVOX engine (offline, best Japanese)
  voicevox_speaker: 3
  edge_voice: ja-JP-NanamiNeural         # edge-tts: online; the text goes to Microsoft
