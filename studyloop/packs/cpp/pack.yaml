# C++ pack: CodeMirror mode, checker settings, lint patterns.
name: cpp
codemirror_mode: text/x-c++src   # registered by mode.js (CodeMirror 5 clike)
mode_file: mode.js
standards: standards.md
std: c++20                       # override with ASL_CXX_STD (e.g. c++23 for std::expected)
# compiler: first found; override with ASL_CXX
compilers: [g++-14, g++-13, clang++-19, clang++-18, clang++-17, clang++-16, clang++-15, g++, clang++]
warnings: [-Wall, -Wextra, -Wpedantic, -Wshadow, -Werror]
sanitizers: [address, undefined]
# clang-tidy (if installed): the Core Guidelines and bug-prone patterns, as errors
tidy_checks: >-
  -*,bugprone-*,cppcoreguidelines-*,modernize-*,performance-*,
  -bugprone-easily-swappable-parameters,-cppcoreguidelines-avoid-magic-numbers,
  -modernize-use-trailing-return-type,-cppcoreguidelines-pro-bounds-array-to-pointer-decay,
  -cppcoreguidelines-avoid-non-const-global-variables
lint:
  comment_prefix: '//'
  frame: '^\s*(template\s*<|(class|struct|enum|union|namespace|concept)\b|[\w:<>,\s*&]+[\s*&]\s*[~\w:]+\s*\([^;]*$)'
  comment: '//[^\n]*'
  string: '"((?:[^"\\]|\\.)*)"'
  ignore_messages: '(?:throw\s+[\w:]+\s*[({]|assert\s*\()\s*"(?:[^"\\]|\\.)*"'
