# Benchmark grid: every task runs in every setup, with and without the workflow.
# Tasks whose sources are private (a textbook PDF, a video) go in tasks.local.yaml next to this
# file (gitignored), same fields; their results name only the task id and kind.

setups:                      # model and effort; ids appear in the results
  haiku-medium:  {model: claude-haiku-5-5,  effort: medium}
  sonnet-medium: {model: claude-sonnet-5-5, effort: medium}
  opus-low:      {model: claude-opus-5-5,   effort: low}
  opus-medium:   {model: claude-opus-5-5,   effort: medium}
  opus-high:     {model: claude-opus-5-5,   effort: high}

arms: [workflow, plain]      # workflow: skills + asl + card home; plain: a plain prompt

tasks:
  rust-ch04:
    kind: code               # code | topic | language (which 5 of the 15 rated cards it feeds)
    topic: Rust Book         # the deck name in the workflow arm
    what: chapter 4 of The Rust Programming Language (ownership, references and borrowing, slices)
    source: fixtures/rust-book/ch04.md          # python benchmarks/fetch_rust_book.py 4
    file: Rust Book/ch04-understanding-ownership.md   # where the run sees it
    pack: rust
    goal: write idiomatic, safe Rust
    builds_on: python
    code_share: 0.3          # the brief's `cards: {code: …}`
  rust-ch10:
    kind: code
    topic: Rust Book
    what: chapter 10 of The Rust Programming Language (generic types, traits and lifetimes)
    source: fixtures/rust-book/ch10.md
    file: Rust Book/ch10-generics-traits-lifetimes.md
    pack: rust
    goal: write idiomatic, safe Rust
    builds_on: python
    code_share: 0.3
