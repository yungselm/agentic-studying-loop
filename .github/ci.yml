name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check studyloop packs tests
      - run: pytest -q tests
      - name: lint example decks
        run: |
          asl lint -q examples/python-core examples/rust-core "example-vault/Studying/Anki cards/tasklog"
      - name: check example decks (ruff + pytest, clippy + cargo test)
        run: |
          rustup component add clippy
          asl check examples/python-core examples/rust-core "example-vault/Studying/Anki cards/tasklog"
      - run: asl build examples/python-core examples/rust-core "example-vault/Studying/Anki cards/tasklog" -o asl-output/examples.apkg
